services:
  postgres:
    image: postgres:17-alpine
    container_name: perugine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: perugine
      POSTGRES_PASSWORD: perugine_dev
      POSTGRES_DB: perugine
    ports:
      - "5432:5432"
    volumes:
      - perugine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perugine -d perugine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  perugine_postgres_data:
